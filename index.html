<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b10">
<title>Push Ups PvP — TRUE ORIGIN</title>

<style>
:root {
  --bg:#0b0b10; --panel:#171720; --panel2:#22222e;
  --text:#f6f4fa; --muted:#a5a2b5; --line:#343442;
  --red:#ef4355; --gold:#f5c65d; --green:#70e0a0;
}
* { box-sizing:border-box; }
body {
  margin:0; background:var(--bg); color:var(--text);
  font-family:system-ui,-apple-system,sans-serif;
}
button,input,select { font:inherit; }
button { cursor:pointer; touch-action:manipulation; }
button:focus-visible,input:focus-visible,select:focus-visible {
  outline:2px solid var(--gold); outline-offset:3px;
}
.app { max-width:760px; margin:auto; min-height:100vh; padding-bottom:95px; }
header {
  position:sticky; top:0; z-index:5; padding:16px;
  background:#101016f5; border-bottom:1px solid var(--line);
  display:flex; justify-content:space-between; align-items:center;
}
.brand { font-weight:950; letter-spacing:1px; }
.brand span { color:var(--red); }
.gold { color:var(--gold); font-weight:850; }
main { padding:16px; }
h1 { font-size:28px; margin:0 0 10px; }
h2 { font-size:21px; }
h3 { font-size:16px; }
p { line-height:1.5; }
.muted { color:var(--muted); }
.small { font-size:12px; }
.panel {
  background:var(--panel); border:1px solid var(--line);
  border-radius:17px; padding:16px; margin-bottom:14px;
}
.hero {
  padding:24px 20px; border-radius:20px; margin-bottom:16px;
  background:radial-gradient(ellipse at 90% 0%,#59242e,transparent 50%),
  linear-gradient(135deg,#25161e,#111118 75%);
  border:1px solid #59313c;
}
.eyebrow { color:var(--red); font-size:11px; font-weight:900; letter-spacing:2px; }
.hero-title { font-size:35px; line-height:1.1; font-weight:950; margin:10px 0; }
button.primary,button.secondary,button.gold-btn,button.danger {
  border-radius:11px; padding:12px 15px; font-weight:800;
}
button.primary { background:var(--red); color:white; border:0; }
button.secondary { background:var(--panel2); color:white; border:1px solid var(--line); }
button.gold-btn { background:var(--gold); color:#241b08; border:0; }
button.danger { background:#3b1920; color:#ffb3bc; border:1px solid #65303c; }
button:disabled { opacity:.45; cursor:not-allowed; }
.actions { display:flex; gap:8px; flex-wrap:wrap; }
.grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
.stat { background:var(--panel2); border:1px solid var(--line); border-radius:14px; padding:14px; }
.stat strong { display:block; font-size:26px; }
.stat span { font-size:12px; color:var(--muted); }
nav {
  position:fixed; bottom:0; left:0; right:0; z-index:10;
  background:#101016f7; border-top:1px solid var(--line);
  padding:8px 3px calc(8px + env(safe-area-inset-bottom));
}
.nav-inner { max-width:760px; margin:auto; display:flex; justify-content:space-around; }
.nav-btn {
  flex:1; min-width:0; border:0; background:transparent;
  color:var(--muted); display:flex; flex-direction:column;
  align-items:center; gap:3px; padding:7px 2px; font-size:10px;
}
.nav-btn b { font-size:20px; }
.nav-btn.active { color:white; }
.nav-btn.active b { color:var(--red); }
.world {
  text-align:left; color:white; background:var(--panel);
  border:1px solid var(--line); border-radius:14px; padding:13px;
  min-width:0;
}
.world.selected { border-color:var(--red); background:#2b1920; }
.world .emoji { font-size:25px; }
.world strong { display:block; margin:6px 0; }
.world small { color:var(--muted); }
.progress { height:8px; background:#30303d; border-radius:10px; overflow:hidden; }
.progress div { height:100%; width:0; background:var(--red); transition:width .2s; }
.row { display:flex; justify-content:space-between; align-items:center; gap:10px; }
.field { display:grid; gap:6px; margin-bottom:13px; }
.field label { color:var(--muted); font-size:13px; }
.field input,.field select {
  width:100%; padding:12px; border-radius:10px;
  background:var(--panel2); border:1px solid var(--line); color:white;
}
.rep-number { font-size:66px; font-weight:950; text-align:center; margin:12px; }
.rep-button { width:100%; padding:22px !important; font-size:19px; }
.item { display:flex; justify-content:space-between; align-items:center; gap:12px; }
.item button { flex-shrink:0; }
#toast {
  position:fixed; left:50%; bottom:100px; transform:translateX(-50%);
  z-index:30; background:#292936; border:1px solid var(--line);
  padding:12px 16px; border-radius:12px; max-width:90%;
  display:none; text-align:center;
}
#debug { white-space:pre-wrap; overflow-wrap:anywhere; color:#ffb3bc; }
hr { border:0; border-top:1px solid var(--line); margin:15px 0; }
@media(min-width:550px) {
  .grid.world-grid { grid-template-columns:repeat(3,minmax(0,1fr)); }
}
</style>
</head>

<body>
<div class="app">
<header>
  <div class="brand">PUSH UPS <span>PvP</span></div>
  <div class="gold">🪙 <span id="gold">0</span></div>
</header>

<main id="screen"></main>

<nav>
  <div class="nav-inner">
    <button class="nav-btn active" data-page="home"><b>⌂</b>Home</button>
    <button class="nav-btn" data-page="train"><b>💪</b>Train</button>
    <button class="nav-btn" data-page="worlds"><b>⚔</b>Worlds</button>
    <button class="nav-btn" data-page="shop"><b>🛍</b>Shop</button>
    <button class="nav-btn" data-page="pvp"><b>🏆</b>PvP</button>
    <button class="nav-btn" data-page="account"><b>👤</b>Account</button>
  </div>
</nav>
</div>

<div id="toast" role="status"></div>

<script>
(function () {
"use strict";

const $ = id => document.getElementById(id);
const KEY = "pushups_pvp_true_origin_v1";

const worlds = [
  {id:"naruto", name:"Naruto", icon:"🍃",
   ranks:["Academy Student","Genin","Chunin","Jonin","ANBU","Kage","Six Paths"]},
  {id:"bleach", name:"Bleach", icon:"⚔️",
   ranks:["Academy Student","Seated Officer","Lieutenant","Captain","Bankai Master","Transcendent"]},
  {id:"dragonball", name:"Dragon Ball", icon:"🐉",
   ranks:["Martial Artist","Elite Fighter","Super Saiyan","Super Saiyan God","Super Saiyan Blue","Ultra Instinct"]},
  {id:"onepiece", name:"One Piece", icon:"🏴‍☠️",
   ranks:["Rookie Pirate","Notorious Pirate","Grand Line Veteran","New World Raider","Commander","Emperor","Pirate Legend"]},
  {id:"jjk", name:"Jujutsu Kaisen", icon:"👁️",
   ranks:["Grade 4","Grade 3","Grade 2","Semi-Grade 1","Grade 1","Special Grade"]},
  {id:"solo", name:"Solo Leveling", icon:"🌑",
   ranks:["E-Rank","D-Rank","C-Rank","B-Rank","A-Rank","S-Rank","National Level","Monarch"]},
  {id:"origin", name:"TRUE ORIGIN", icon:"🔥",
   ranks:["Mortal Realm","Tempering Realm","Meridian Realm","Master Realm","Grandmaster Realm","Transcendent Realm","True Origin Realm"]}
];

const items = [
  {id:"tank",name:"Basic White Tank Top",cat:"Shirt",price:0},
  {id:"sweats",name:"Grey Sweatpants",cat:"Pants",price:0},
  {id:"flipflops",name:"Black Flip-Flops",cat:"Shoes",price:0},
  {id:"buzz",name:"Buzz Cut",cat:"Hair",price:0},
  {id:"beard",name:"Rough Stubble",cat:"Facial Hair",price:0},
  {id:"blacktee",name:"Black Oversized Tee",cat:"Shirt",price:100},
  {id:"maroon",name:"Maroon Formal Shirt",cat:"Shirt",price:150},
  {id:"jeans",name:"Dark Straight Jeans",cat:"Pants",price:120},
  {id:"boots",name:"Black Boots",cat:"Shoes",price:100},
  {id:"middlepart",name:"Middle-Part Hair",cat:"Hair",price:100},
  {id:"chain",name:"Silver Chain",cat:"Accessories",price:80},
  {id:"kage",name:"Kage Prestige Jacket",cat:"Prestige",price:500,world:"naruto",rank:5},
  {id:"captain",name:"Captain's Coat",cat:"Prestige",price:500,world:"bleach",rank:3},
  {id:"emperor",name:"Emperor Outfit",cat:"Prestige",price:700,world:"onepiece",rank:5},
  {id:"monarch",name:"Monarch Outfit",cat:"Prestige",price:800,world:"solo",rank:7},
  {id:"originfit",name:"TRUE ORIGIN Regalia",cat:"Prestige",price:1000,world:"origin",rank:6}
];

function freshState() {
  return {
    username:"",
    age:"",
    height:"",
    weight:"",
    gold:0,
    totalReps:0,
    totalXP:0,
    sessions:0,
    selectedWorld:"origin",
    worldXP:{},
    owned:["tank","sweats","flipflops","buzz","beard"],
    equipped:{Shirt:"tank",Pants:"sweats",Shoes:"flipflops",Hair:"buzz","Facial Hair":"beard"},
    category:"Shirt",
    reps:0,
    onboarding:false
  };
}

let state = freshState();
let page = "home";
let toastTimer;

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return;
    const saved = JSON.parse(raw);
    if (!saved || typeof saved !== "object") return;
    state = Object.assign(freshState(), saved);
    if (!Array.isArray(state.owned)) state.owned = freshState().owned;
    if (!state.worldXP || typeof state.worldXP !== "object") state.worldXP = {};
    if (!state.equipped || typeof state.equipped !== "object") state.equipped = {};
  } catch (e) {
    console.error("Could not load saved progress", e);
  }
}

function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify(state));
  } catch (e) {
    console.error("Could not save progress", e);
    notify("Browser storage unavailable. Progress may not persist.");
  }
}

function notify(message) {
  const el = $("toast");
  el.textContent = message;
  el.style.display = "block";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.style.display = "none"; }, 2400);
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  })[c]);
}

function world() {
  return worlds.find(w => w.id === state.selectedWorld) || worlds[6];
}

function xpForWorld(id) {
  return Number(state.worldXP[id] || 0);
}

function rankIndex(id) {
  const w = worlds.find(x => x.id === id);
  return Math.min(w.ranks.length - 1, Math.floor(xpForWorld(id) / 100));
}

function rankName(id) {
  const w = worlds.find(x => x.id === id);
  return w.ranks[rankIndex(id)];
}

function addReps(count) {
  count = Math.floor(Number(count));
  if (!Number.isFinite(count) || count < 1 || count > 500) {
    notify("Enter a valid rep count from 1 to 500.");
    return;
  }
  state.reps += count;
  state.totalReps += count;
  state.totalXP += count * 10;
  state.gold += count * 2;
  const id = state.selectedWorld;
  state.worldXP[id] = xpForWorld(id) + count * 10;
  save();
  render();
  notify("+" + count * 10 + " XP · +" + count * 2 + " gold");
}

function startSession() {
  if (state.reps > 0) {
    state.sessions++;
    state.reps = 0;
    save();
    render();
    notify("Training session completed!");
  } else {
    notify("Record some reps first!");
    page = "train";
    render();
  }
}

function onboardingScreen() {
  return `
    <div class="hero">
      <div class="eyebrow">YOUR JOURNEY BEGINS</div>
      <div class="hero-title">RISE FROM<br>ZERO.</div>
      <p class="muted">Train consistently. Earn XP. Climb your chosen world.</p>
    </div>
    <div class="panel">
      <h2>Create your profile</h2>
      <p class="muted small">These details stay in this browser in this prototype. They do not determine your body shape or appearance.</p>
      <form id="onboardForm">
        <div class="field"><label for="username">Username</label><input id="username" name="username" minlength="3" maxlength="20" required placeholder="Choose a username"></div>
        <div class="grid">
          <div class="field"><label for="age">Age</label><input id="age" name="age" type="number" min="13" max="100" required></div>
          <div class="field"><label for="height">Height (cm)</label><input id="height" name="height" type="number" min="80" max="250" required></div>
        </div>
        <div class="field"><label for="weight">Weight (kg)</label><input id="weight" name="weight" type="number" min="20" max="300" step="0.1" required></div>
        <button class="primary" type="submit">ENTER THE ARENA →</button>
      </form>
    </div>`;
}

function homeScreen() {
  return `
    <div class="hero">
      <div class="eyebrow">WELCOME BACK, ${escapeHTML(state.username || "FIGHTER")}</div>
      <div class="hero-title">YOUR NEXT<br>LEVEL AWAITS.</div>
      <p class="muted">Every rep counts. Build your progress one session at a time.</p>
      <button class="primary" data-go="train">START TRAINING →</button>
    </div>
    <div class="grid">
      <div class="stat"><strong>${state.totalReps}</strong><span>Total push-ups</span></div>
      <div class="stat"><strong>${state.totalXP}</strong><span>Total XP</span></div>
      <div class="stat"><strong>${state.sessions}</strong><span>Sessions completed</span></div>
      <div class="stat"><strong>${state.gold}</strong><span>Gold earned</span></div>
    </div>
    <div class="panel" style="margin-top:14px">
      <div class="eyebrow">CURRENT UNIVERSE</div>
      <h2>${world().icon} ${world().name}</h2>
      <p class="gold">${rankName(state.selectedWorld)}</p>
      <div class="progress"><div style="width:${xpForWorld(state.selectedWorld)%100}%"></div></div>
      <p class="muted small">${xpForWorld(state.selectedWorld)%100}/100 XP to the next rank</p>
      <button class="secondary" data-go="worlds">Explore worlds</button>
    </div>`;
}

function trainScreen() {
  return `
    <h1>Training Arena</h1>
    <p class="muted">Choose your world, then record your reps. This version uses manual counting.</p>
    <div class="panel">
      <div class="row"><span class="muted">Current world</span><strong>${world().icon} ${world().name}</strong></div>
      <div class="rep-number">${state.reps}</div>
      <p class="muted" style="text-align:center">REPS THIS SESSION</p>
      <button class="primary rep-button" data-action="rep">+1 REP</button>
      <div class="actions" style="margin-top:12px">
        <button class="secondary" data-action="rep5">+5 reps</button>
        <button class="secondary" data-action="undo">Undo 1 rep</button>
        <button class="gold-btn" data-action="finish">Finish session</button>
      </div>
    </div>
    <div class="panel">
      <h3>Training rewards</h3>
      <p>Each recorded rep earns <span class="gold">10 XP</span> and <span class="gold">2 gold</span>.</p>
      <p class="muted small">Manual counts are self-reported. They are not verified by a camera or another player.</p>
    </div>`;
}

function worldsScreen() {
  return `
    <h1>Choose your universe</h1>
    <p class="muted">Each world has its own rank progression.</p>
    <div class="grid world-grid">
      ${worlds.map(w => `
        <button class="world ${w.id===state.selectedWorld?"selected":""}" data-world="${w.id}">
          <span class="emoji">${w.icon}</span>
          <strong>${w.name}</strong>
          <small>${rankName(w.id)}</small>
          <div class="progress" style="margin-top:10px"><div style="width:${xpForWorld(w.id)%100}%"></div></div>
        </button>`).join("")}
    </div>
    <div class="panel" style="margin-top:14px">
      <div class="eyebrow">TRUE ORIGIN POWER SYSTEM</div>
      <h2>Seven Realms</h2>
      ${worlds[6].ranks.map((r,i)=>`
        <div class="row" style="padding:10px 0;border-bottom:1px solid var(--line)">
          <span>${i+1}. ${r}</span>
          <span class="muted small">${rankIndex("origin")>=i?"UNLOCKED":"LOCKED"}</span>
        </div>`).join("")}
    </div>`;
}

function shopScreen() {
  const categories = ["Shirt","Pants","Shoes","Hair","Facial Hair","Accessories","Prestige"];
  return `
    <h1>Cosmetic Shop</h1>
    <p class="muted">Cosmetics only. No gameplay advantages.</p>
    <div class="panel">
      <div class="row"><span>Your balance</span><span class="gold">🪙 ${state.gold} gold</span></div>
    </div>
    <div class="actions" style="margin-bottom:14px">
      ${categories.map(c=>`<button class="${state.category===c?"primary":"secondary"}" data-cat="${c}">${c}</button>`).join("")}
    </div>
    ${items.filter(it=>it.cat===state.category).map(it=>{
      const owned = state.owned.includes(it.id);
      const equipped = state.equipped[it.cat]===it.id;
      let locked = false;
      let lockText = "";
      if (it.world) {
        locked = state.selectedWorld !== it.world || rankIndex(it.world) < it.rank;
        lockText = state.selectedWorld !== it.world
          ? "Select "+(worlds.find(w=>w.id===it.world)?.name || it.world)+" to unlock"
          : "Requires "+(worlds.find(w=>w.id===it.world)?.ranks[it.rank] || "higher rank");
      }
      return `<div class="panel item">
        <div><strong>${it.name}</strong><div class="muted small">${locked?lockText:(owned?(equipped?"Equipped":"Owned"):(it.price===0?"Free":it.price+" gold"))}</div></div>
        <button class="${equipped?"secondary":owned?"secondary":"gold-btn"}" data-item="${it.id}" ${locked?"disabled":""}>${equipped?"Equipped":owned?"Equip":it.price===0?"Claim":"Buy"}</button>
      </div>`;
    }).join("")}`;
}

function pvpScreen() {
  return `
    <h1>PvP Arena</h1>
    <div class="hero">
      <div class="eyebrow">COMING NEXT</div>
      <div class="hero-title">CHALLENGE<br>YOUR RIVALS.</div>
      <p class="muted">Online matchmaking is not connected in this version.</p>
    </div>
    <div class="panel">
      <h2>Local profile stats</h2>
      <p>Total reps: <strong>${state.totalReps}</strong></p>
      <p>Total XP: <strong>${state.totalXP}</strong></p>
      <p class="muted small">This is not a global leaderboard. Online matches require Supabase integration and server-side validation.</p>
    </div>
    <button class="secondary" data-go="train">Train while you wait</button>`;
}

function accountScreen() {
  return `
    <h1>Your Account</h1>
    <div class="panel">
      <div class="field"><label for="editUsername">Username</label><input id="editUsername" maxlength="20" minlength="3" value="${escapeHTML(state.username)}"></div>
      <p class="muted small">This prototype saves progress in this browser only. Clearing browser storage may erase it.</p>
      <button class="primary" data-action="saveProfile">Save username</button>
    </div>
    <div class="panel">
      <h3>Equipped cosmetics</h3>
      ${Object.entries(state.equipped).map(([cat,id])=>{
        const it=items.find(x=>x.id===id);
        return `<div class="row" style="padding:8px 0"><span>${cat}</span><span>${it?it.name:"None"}</span></div>`;
      }).join("")}
    </div>
    <div class="panel">
      <h3>Local data</h3>
      <p class="muted small">Resetting deletes this prototype's locally saved progress in this browser.</p>
      <button class="danger" data-action="reset">Reset all local progress</button>
    </div>
    <div class="panel"><h3>Diagnostics</h3><div id="debug" class="small">JavaScript loaded. Navigation handlers active.</div></div>`;
}

function render() {
  $("gold").textContent = state.gold;
  document.querySelectorAll(".nav-btn").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.page===page);
  });

  if (!state.onboarding) {
    $("screen").innerHTML = onboardingScreen();
    return;
  }

  const screens = {
    home:homeScreen,
    train:trainScreen,
    worlds:worldsScreen,
    shop:shopScreen,
    pvp:pvpScreen,
    account:accountScreen
  };
  $("screen").innerHTML = (screens[page] || homeScreen)();
}

function go(nextPage) {
  page = nextPage;
  render();
  window.scrollTo({top:0,behavior:"auto"});
}

function handleClick(event) {
  const button = event.target.closest("button");
  if (!button) return;

  if (button.dataset.page) {
    go(button.dataset.page);
    return;
  }
  if (button.dataset.go) {
    go(button.dataset.go);
    return;
  }
  if (button.dataset.world) {
    state.selectedWorld = button.dataset.world;
    save();
    render();
    notify("Selected " + world().name);
    return;
  }
  if (button.dataset.cat) {
    state.category = button.dataset.cat;
    render();
    return;
  }
  if (button.dataset.item) {
    const it = items.find(x=>x.id===button.dataset.item);
    if (!it) return;
    if (!state.owned.includes(it.id)) {
      if (state.gold < it.price) {
        notify("Not enough gold. Earn more
